<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
  "
    />
    <title>Panchayat Automation</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./dist/styles.css" />
  </head>

  <body>
    <div class="card app-card">
      <div class="card-body p-4">
        <div class="app-header">
          <div class="logo-wrapper">
            <div class="logo">
              <svg viewBox="0 0 24 24">
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                ></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
            </div>
          </div>
          <div class="title">Work Automation</div>
          <div class="subtitle">
            Select Blockname and Financial Year to begin automated task runner
          </div>
        </div>

        <form id="automationForm" novalidate>
          <div class="form-group">
            <label for="blockName" class="form-label">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"
                />
              </svg>
              Blockname
            </label>
            <div class="form-control-wrapper">
              <select id="blockName" class="form-select" required>
                <option value="">Select Blockname</option>
              </select>
              <svg
                class="validation-icon validation-icon-valid"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <svg
                class="validation-icon validation-icon-invalid"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
            </div>
            <div class="error-feedback">Please select a valid Panchayat.</div>
          </div>

          <div class="form-group">
            <label for="financialYear" class="form-label">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              Financial Year
            </label>
            <div class="form-control-wrapper">
              <select id="financialYear" class="form-select" required>
                <option value="">Select Financial Year</option>
              </select>
              <svg
                class="validation-icon validation-icon-valid"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <svg
                class="validation-icon validation-icon-invalid"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
            </div>
            <div class="error-feedback">Please select a Financial Year.</div>
          </div>

          <!-- Task list(s) selection -->
          <div class="form-group">
            <label class="form-label">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 11l3 3L22 4" />
                <path
                  d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
                />
              </svg>
              Task Types
            </label>
            <div id="taskTypesGroup" class="d-flex flex-row gap-4 pt-1">
              <!-- Checkboxes will be rendered dynamically here -->
            </div>
            <div id="taskTypesError" class="error-feedback">
              Please select at least one option.
            </div>
          </div>

          <div class="actions-group">
            <button type="button" id="resetBtn" class="btn btn-reset">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M23 4v6h-6" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
              Reset
            </button>
            <button type="submit" id="submitBtn" class="btn btn-run">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
              Start Automation
            </button>
          </div>

          <div id="status"></div>

          <div class="footer-text">Copyright &copy; RABS Professionals</div>
        </form>
      </div>
    </div>

    <!-- Full-Page Overlay Loader -->
    <div id="overlayLoader" class="overlay-loader">
      <div class="spinner-container">
        <div class="spinner-ring"></div>
        <div class="spinner-ring-inner"></div>
        <div class="loader-icon">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"
            />
          </svg>
        </div>
      </div>
      <div class="loader-text">Running Automation...</div>
      <div class="loader-subtext">Please wait while tasks are executing</div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("automationForm");
        const blockNameSelect = document.getElementById("blockName");
        const fySelect = document.getElementById("financialYear");
        const resetBtn = document.getElementById("resetBtn");
        const statusDiv = document.getElementById("status");
        const overlayLoader = document.getElementById("overlayLoader");

        const showLoader = () => overlayLoader.classList.add("active");
        const hideLoader = () => overlayLoader.classList.remove("active");

        const validateField = (field) => {
          if (field.value !== "") {
            field.classList.remove("is-invalid");
            field.classList.add("is-valid");
            checkGlobalValidity();
            return true;
          } else {
            field.classList.remove("is-valid");
            field.classList.add("is-invalid");
            return false;
          }
        };

        const checkGlobalValidity = () => {
          if (blockNameSelect.value !== "" && fySelect.value !== "") {
            if (
              statusDiv.textContent === "Please fill out all required fields."
            ) {
              statusDiv.textContent = "";
            }
          }
        };

        [blockNameSelect, fySelect].forEach((select) => {
          select.addEventListener("change", () => validateField(select));
        });

        resetBtn.addEventListener("click", () => {
          form.reset();
          [blockNameSelect, fySelect].forEach((select) => {
            select.classList.remove("is-valid", "is-invalid");
          });
          statusDiv.textContent = "";
          hideLoader();
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const isBlockValid = validateField(blockNameSelect);
          const isFyValid = validateField(fySelect);

          if (isBlockValid && isFyValid) {
            statusDiv.className = "text-success font-weight-bold";
            statusDiv.textContent = "Processing automation...";
            showLoader();

            try {
              // 1. Save configuration first if required
              await window.electronAPI.saveSelectionConfig({
                blockName: blockNameSelect.value,
                financialYear: fySelect.value,
              });

              // 2. Trigger the batch process runner via IPC
              const result = await window.electronAPI.runProcess();

              if (result.success) {
                statusDiv.textContent = result.message;
              } else {
                statusDiv.className = "text-danger";
                statusDiv.textContent = result.message;
              }
            } catch (error) {
              statusDiv.className = "text-danger";
              statusDiv.textContent = "Error executing automation process.";
              console.error(error);
            } finally {
              // 3. Always hide the loader when finished (success or failure)
              hideLoader();
            }
          } else {
            statusDiv.className = "text-danger";
            statusDiv.textContent = "Please fill out all required fields.";
          }
        });
      });
    </script>
    <script src="./renderer.js"></script>
  </body>
</html>
